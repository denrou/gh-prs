[package]
name = "gh-prs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "CLI for listing GitHub pull requests that need your attention, powered by gh CLI"
license.workspace = true
repository.workspace = true
publish.workspace = true

[[test]]
name = "conformance"
path = "tests/conformance/main.rs"
harness = false

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6.7", features = ["derive"] }
indicatif = "0.18.6"
jiff = "0.2.38"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
terminal_size = "0.4.4"
thiserror = "2.0.21"
unicode-width = "0.2.2"
wait-timeout = "0.2.1"

[dev-dependencies]
jiff = { version = "0.2.38", features = ["tzdb-bundle-always"] }
libtest-mimic = "0.8.2"
regex = "1.13.1"
serde_json = "1.0.154"
tempfile = "3.27.0"

[lints]
workspace = true
