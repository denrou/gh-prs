# Lint and test on every push to main. Agents commit straight to main, so
# this is the safety net that catches what a local run missed.

name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes exact versions only, no floating major tag.
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  rust:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --lib
      - run: cargo test --test conformance
      # Until the switch (docs/rust-port.md), the suite also runs against the
      # Python version: the scenarios were blessed from it, and a change to
      # either version must keep the two in step.
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - run: cargo test --test conformance
        env:
          GH_PRS_BIN: .venv/bin/gh-prs
